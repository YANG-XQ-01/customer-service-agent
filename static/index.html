<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电商智能客服 Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #eef1f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #2b6de8;
      color: #fff;
      padding: 14px 20px;
      font-size: 17px;
      font-weight: bold;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2b6de8;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      color: #333;
      border-bottom-left-radius: 2px;
    }
    .msg.system {
      align-self: center;
      background: #fff7e6;
      color: #8a5a00;
      border: 1px solid #ffe0a3;
      font-size: 13px;
      max-width: 90%;
      text-align: center;
    }
    footer {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 15px;
    }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 20px;
      background: #2b6de8;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>🛒 电商智能客服 Agent</header>
  <main id="chat-box"></main>
  <footer>
    <input id="input" type="text" placeholder="输入你的问题，回车发送" autocomplete="off">
    <button id="send">发送</button>
  </footer>
  <script src="/static/chat.js"></script>
</body>
</html>
